name: Run cURL tests

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  curl-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: final_project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Start server and run cURL commands
        run: |
          node index.js > server.log 2>&1 &
          sleep 5
          OUT=outputs.txt
          run() {
            local name="$1"; shift
            local cmd="$*"
            {
              echo "===== $name ====="
              echo "\$ $cmd"
              eval "$cmd"
              echo
              echo
            } >> "$OUT"
          }
          run githubrepo       'curl https://api.github.com/repos/${{ github.repository }}'
          run getallbooks      'curl localhost:5000/'
          run getbooksbyISBN   'curl localhost:5000/isbn/1'
          run getbooksbyauthor 'curl "localhost:5000/author/Jane%20Austen"'
          run getbooksbytitle  'curl "localhost:5000/title/Things%20Fall%20Apart"'
          run getbookreview    'curl localhost:5000/review/1'
          run register         "curl -X POST localhost:5000/register -H \"Content-Type: application/json\" -d '{\"username\":\"user1\",\"password\":\"password1\"}'"
          run login            "curl -X POST localhost:5000/customer/login -H \"Content-Type: application/json\" -d '{\"username\":\"user1\",\"password\":\"password1\"}' -c cookies.txt"
          run reviewadded      'curl -X PUT "localhost:5000/customer/auth/review/1?review=This%20is%20a%20great%20book" -b cookies.txt'
          run deletereview     'curl -X DELETE localhost:5000/customer/auth/review/1 -b cookies.txt'
          cat "$OUT"
          {
            echo '## cURL outputs'
            echo '```'
            cat "$OUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test Axios client functions (general.js)
        run: |
          node index.js > server2.log 2>&1 &
          sleep 3
          node -e '
            const g = require("./router/general.js");
            (async () => {
              const all = await g.getAllBooksAxios();
              console.log("getAllBooksAxios ->", Object.keys(all).length, "books");
              console.log("getBookByISBNAxios(1) ->", (await g.getBookByISBNAxios(1)).title);
              console.log("getBooksByAuthorAxios(Jane Austen) ->", JSON.stringify(await g.getBooksByAuthorAxios("Jane Austen")));
              console.log("getBooksByTitleAxios(Things Fall Apart) ->", JSON.stringify(await g.getBooksByTitleAxios("Things Fall Apart")));
              process.exit(0);
            })().catch(e => { console.error(e); process.exit(1); });
          ' | tee axios.txt
          { echo '## Axios functions'; echo '```'; cat axios.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
